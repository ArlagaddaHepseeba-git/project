name: Build Push and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Build WAR File
        run: mvn clean package


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build Docker Image
        run: docker build -t hepseeba/userproject:v1 .


      - name: Push Docker Image
        run: docker push hepseeba/userproject:v1


      - name: Deploy Application to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |

            echo "Pulling latest Docker image"

            sudo docker pull hepseeba/userproject:v1


            echo "Stopping old container"

            sudo docker stop userproject-container || true


            echo "Removing old container"

            sudo docker rm userproject-container || true


            echo "Starting new container"

            sudo docker run -d \
              --name userproject-container \
              -p 8080:8080 \
              hepseeba/userproject:v1


            echo "Deployment completed successfully"
